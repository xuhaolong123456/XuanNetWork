spring:
  application:
    name: network-disk-backend
  elasticsearch:
    uris: ${SPRING_ELASTICSEARCH_URIS:http://localhost:9200}
  profiles:
    default: dev
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 2GB
      # 为 multipart 表单头预留空间，保证恰好 2 GiB 的直传文件可以上传。
      max-request-size: 2049MB
      file-size-threshold: 0
app:
  storage:
    root: ${FILE_STORAGE_ROOT:./uploads}
    max-file-size-bytes: ${FILE_MAX_SIZE_BYTES:2147483648}
    download-temp-root: ${DOWNLOAD_TEMP_ROOT:./download-tmp}
    download-cleanup-delay-ms: ${DOWNLOAD_CLEANUP_DELAY_MS:3600000}
  mail.enabled: ${MAIL_ENABLED:true}
  login:
    fail-lock-threshold: ${LOGIN_FAIL_LOCK_THRESHOLD:5}
    fail-window-ttl-seconds: ${LOGIN_FAIL_WINDOW_TTL_SECONDS:900}
    ip-max-attempts: ${LOGIN_IP_MAX_ATTEMPTS:10}
    ip-window-ttl-seconds: ${LOGIN_IP_WINDOW_TTL_SECONDS:60}
    device-max-attempts: ${LOGIN_DEVICE_MAX_ATTEMPTS:10}
    device-window-ttl-seconds: ${LOGIN_DEVICE_WINDOW_TTL_SECONDS:300}
    captcha-ttl-seconds: ${LOGIN_CAPTCHA_TTL_SECONDS:300}
  auth:
    # 仅用于本地开发；部署时必须通过环境变量覆盖。
    token-secret: ${AUTH_TOKEN_SECRET:bG9jYWwtZGV2ZWxvcG1lbnQtdG9rZW4tc2VjcmV0LWNoYW5nZS1tZQ==}
    token-ttl-seconds: ${AUTH_TOKEN_TTL_SECONDS:7200}
    # 设为 false 时支持本地 HTTP；通过 HTTPS 提供服务时应设置 AUTH_COOKIE_SECURE=true。
    cookie-secure: ${AUTH_COOKIE_SECURE:false}

server:
  port: 9090

  servlet:
    context-path: /

logging:
  file:
    name: logs/network-disk.log
  logback:
    rollingpolicy:
      file-name-pattern: logs/network-disk.%d{yyyy-MM-dd}.%i.log
      max-history: 7
      max-file-size: 10MB
  level:
    com.networkdisk: INFO
