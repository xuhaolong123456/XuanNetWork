name: ssh-test

on:
  push:
    branches:
      - main

jobs:
  ssh-test:

    runs-on: ubuntu-latest

    steps:
      - name: SSH Tencent Cloud
        uses: appleboy/ssh-action@master

        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY }}

          script: |
            echo "SSH success"
            whoami
            pwd
