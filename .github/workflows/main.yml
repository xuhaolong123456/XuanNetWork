name: deploy


on:
  push:
    branches:
      - main


jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Deploy Server

        uses: appleboy/ssh-action@master

        with:

          host: ${{ secrets.SERVER_HOST }}

          username: ubuntu

          key: ${{ secrets.SERVER_SSH_KEY }}

          script: |

            cd /home/ubuntu/XuanNetWork

            git pull origin main

            echo "deploy success"
